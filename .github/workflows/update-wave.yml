name: Update area wave (daily)

on:
  schedule:
    - cron: '23 21 * * *'   # every day 21:23 UTC (06:23 JST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-area-wave
  cancel-in-progress: false

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private geosignals repo
        uses: actions/checkout@v5
        with:
          repository: xxixdegrees/geosignals
          token: ${{ secrets.GEOSIGNALS_WRITE_TOKEN }}
          path: geosignals

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: geosignals
        run: pip install -r requirements.txt numpy pandas scikit-learn

      - name: Refresh event data
        working-directory: geosignals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python wave/update_data.py

      - name: Build waves
        working-directory: geosignals
        run: |
          python wave/events_wave.py
          python wave/wave_export.py

      - name: Commit and push
        working-directory: geosignals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wave.json wave/data
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Update area wave"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
